<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{product}}</title>
<style>
  :root { --bg: #04080d; --bg2: #071018; --line: rgba(80, 200, 255, 0.22); --line-strong: rgba(120, 220, 255, 0.55);
          --cyan: #3fd0ff; --cyan-bright: #a6ecff; --red: #ff5470; --text: #cfe9f5; --dim: #6f95a8;
          --mono: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(900px 600px at 50% 40%, #0a1a27 0%, var(--bg2) 45%, var(--bg) 100%); color: var(--text);
         font-family: var(--sans); display: flex; align-items: center; justify-content: center; padding: 16px; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); }
  .panel { position: relative; width: min(380px, 100%); background: rgba(8, 22, 34, 0.6); border: 1px solid var(--line);
           padding: 34px 30px 28px; backdrop-filter: blur(6px); animation: fade .5s ease; }
  .panel::before, .panel::after { content: ""; position: absolute; width: 16px; height: 16px; border-color: var(--line-strong); border-style: solid; }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand svg { width: 38px; height: 38px; }
  .brand .name { font-size: 20px; font-weight: 300; letter-spacing: 0.42em; color: var(--cyan-bright); text-shadow: 0 0 12px rgba(63,208,255,.6); }
  .brand .sub { font-size: 10px; letter-spacing: 0.3em; color: var(--dim); text-transform: uppercase; margin-top: 2px; }
  label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cyan); margin-bottom: 8px; }
  input { width: 100%; background: rgba(4, 12, 20, 0.8); border: 1px solid var(--line-strong); color: var(--cyan-bright); font-family: var(--mono);
          font-size: 15px; padding: 12px 14px; outline: none; letter-spacing: 0.08em; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(63,208,255,.25); }
  button { width: 100%; margin-top: 14px; background: rgba(63,208,255,.08); border: 1px solid var(--line-strong); color: var(--cyan);
           font-family: var(--mono); font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; padding: 12px; cursor: pointer; }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(63,208,255,.35); color: var(--cyan-bright); }
  .err { min-height: 18px; font-family: var(--mono); font-size: 11px; color: var(--red); margin: 12px 0 0; letter-spacing: 0.05em; }
  .note { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 18px; text-align: center; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <form class="panel" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#3fd0ff" stroke-width="1.2">
        <circle cx="20" cy="20" r="18" opacity=".5"/><circle cx="20" cy="20" r="12" stroke-dasharray="6 4"/>
        <circle cx="20" cy="20" r="5" fill="#3fd0ff" fill-opacity=".35"/><path d="M20 2v6M20 32v6M2 20h6M32 20h6" opacity=".7"/></g></svg>
      <div><div class="name">{{product}}</div><div class="sub">secure access</div></div>
    </div>
    <label for="password">Dashboard password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <input type="hidden" name="next" value="{{next}}">
    <button type="submit">Sign in</button>
    <p class="err">{{error}}</p>
    <p class="note">sessions last on this device until you sign out</p>
  </form>
</body>
</html>
